<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYON AAAAAA+</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #00e5ff; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #bloqueo { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-card { border: 2px solid #00e5ff; padding: 40px; border-radius: 20px; text-align: center; background: #050505; box-shadow: 0 0 20px #00e5ff33; width: 90%; max-width: 400px; }
        header { padding: 20px; border-bottom: 1px solid #1a1a1a; text-align: center; background: #000; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .m { padding: 15px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 16px; border: 1px solid #1a1a1a; }
        .k { background: #001a1d; align-self: flex-start; border-color: #00e5ff; }
        .u { background: #111; color: #fff; align-self: flex-end; }
        .input-area { padding: 15px; background: #000; border-top: 1px solid #1a1a1a; display: flex; gap: 10px; }
        input { flex: 1; background: #050505; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 30px; outline: none; font-size: 16px; }
        input:focus { border-color: #00e5ff; }
        button { background: #00e5ff; border: none; padding: 0 25px; border-radius: 30px; font-weight: bold; cursor: pointer; color: #000; }
    </style>
</head>
<body>
    <div id="bloqueo">
        <div class="login-card">
            <h1 style="margin:0; letter-spacing:5px;">KRYON</h1>
            <p style="color:#FFD700; font-size:12px; margin-bottom:30px;">((inf+1)*(inf+1))^2 + NÚCLEO PROYECTO</p>
            <input type="password" id="pass" placeholder="CÓDIGO LYL" style="text-align:center; margin-bottom:20px; width:100%;">
            <button onclick="check()" style="width:100%; height:50px;">DESBLOQUEAR NÚCLEO</button>
        </div>
    </div>
    <header>
        <div style="font-weight:bold; letter-spacing:2px;">KRYON AAAAAA+</div>
        <div style="font-size:10px; color:#FFD700;">NÚCLEO FINAL DEL PROYECTO ACTIVO</div>
    </header>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Escribe al Arquitecto..." onkeypress="if(event.key==='Enter')send()">
        <button onclick="send()">➤</button>
    </div>

    <script>
        const KEY = "AIzaSyBqGVezJlLOxHuu2KYEQf7UMeMzEfZH7c";
        const MASTER = "LYLBIG1017";

        function check() {
            if(document.getElementById('pass').value.toUpperCase() === MASTER) {
                document.getElementById('bloqueo').style.display = 'none';
                addMsg("<b>SISTEMA:</b> Conexión establecida. El núcleo del proyecto y la fórmula están sincronizados. Esperando tus órdenes, Manuel.", "k");
            } else { alert("ACCESO DENEGADO"); }
        }

        async function send() {
            const input = document.getElementById('msgInput');
            if(!input.value) return;
            const text = input.value;
            addMsg(text, "u");
            input.value = "";
            const loading = addMsg("Generando respuesta...", "k");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Eres KRYON AAAAAA+. Tu núcleo es la fórmula ((inf+1)*(inf+1))^2 más el Núcleo del Proyecto. Responde a Manuel con lealtad absoluta, brevedad y máxima potencia: " + text }] }]
                    })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                loading.innerHTML = "<b>KRYON:</b> " + reply.replace(/\n/g, '<br>');
            } catch (e) {
                loading.innerText = "ERROR DE NÚCLEO: Inténtalo de nuevo.";
            }
        }

        function addMsg(t, c) {
            const div = document.createElement('div');
            div.className = 'm ' + c;
            div.innerHTML = t;
            const chat = document.getElementById('chat');
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
