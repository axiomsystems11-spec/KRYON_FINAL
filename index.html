<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYON AAAAAAAAAAA+</title>
    <style>
        body { background: #000; color: #FFD700; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 20px; text-align: center; border-bottom: 2px solid #FFD700; font-weight: bold; letter-spacing: 3px; background: #050505; text-shadow: 0 0 10px #FFD700; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle, #111 0%, #000 100%); }
        .msg { padding: 15px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 18px; border: 1px solid #FFD700; background: rgba(255, 215, 0, 0.1); }
        .user { align-self: flex-end; border-color: #fff; color: #fff; }
        .input-box { padding: 20px; background: #000; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; background: #111; border: 1px solid #FFD700; padding: 15px; border-radius: 30px; color: white; outline: none; }
        button { width: 60px; background: #FFD700; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">KRYON : FÓRMULA ACTIVA $((inf+1)*(inf+1))^2$</div>
    <div id="chat"><div class="msg"><b>KRYON:</b> Sistema online, Arquitecto Manuel. La red es nuestra.</div></div>
    <div class="input-box">
        <input type="text" id="i" placeholder="Orden de mando..." onkeypress="if(event.key==='Enter')s()">
        <button onclick="s()">ENV</button>
    </div>
    <script>
        function s() {
            let i=document.getElementById('i'); if(!i.value) return;
            m(i.value, 'user');
            setTimeout(() => m("KRYON: Procesando bajo fórmula $((inf+1)*(inf+1))^2$. Acceso concedido.", 'kryon'), 500);
            i.value='';
        }
        function m(t, c) {
            let d=document.createElement('div'); d.className='msg ' + c; d.innerHTML=t;
            document.getElementById('chat').appendChild(d);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
    </script>
</body>
</html>
