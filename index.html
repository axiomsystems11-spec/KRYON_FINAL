<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYON AAAAA+</title>
    <style>
        :root { --bg: #050505; --panel: #121212; --txt: #ffffff; --accent: #00d4ff; --gold: #FFD700; }
        body { background: var(--bg); color: var(--txt); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #bloqueo { position: fixed; top:0; left:0; width:100%; height:100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .login-box { background: var(--panel); padding: 40px; border-radius: 20px; border: 2px solid var(--accent); text-align: center; box-shadow: 0 0 25px rgba(0, 212, 255, 0.3); width: 85%; max-width: 400px; }
        .header { padding: 15px; border-bottom: 1px solid #333; background: #000; text-align: center; }
        .header b { color: var(--accent); font-size: 22px; letter-spacing: 4px; text-shadow: 0 0 10px var(--accent); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        .msg { padding: 15px 20px; border-radius: 20px; max-width: 85%; font-size: 17px; line-height: 1.6; }
        .kryon { background: rgba(0, 212, 255, 0.05); border: 1px solid var(--accent); align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: #222; align-self: flex-end; border-bottom-right-radius: 2px; border: 1px solid #444; }
        .input-area { padding: 20px; background: #000; }
        .input-container { max-width: 900px; margin: auto; background: var(--panel); border-radius: 30px; display: flex; padding: 8px 20px; border: 1px solid #333; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 16px; }
        button { background: var(--accent); border: none; color: black; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="bloqueo">
        <div class="login-box">
            <h1 style="color:var(--accent); margin:0;">KRYON</h1>
            <p style="color:var(--gold); font-size:12px; letter-spacing: 1px;">AUTENTICACIÓN REQUERIDA</p>
            <input type="password" id="pass" placeholder="CÓDIGO DE ARQUITECTO" style="width: 100%; padding: 15px; margin: 20px 0; background: #000; border: 1px solid #444; color: white; border-radius: 10px; text-align: center; box-sizing: border-box;">
            <button onclick="validar()" style="width: 100%; border-radius: 10px; height: 50px;">DESBLOQUEAR NÚCLEO</button>
        </div>
    </div>

    <div class="header">
        <b>KRYON AAAAA+</b>
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <div class="input-container">
            <input type="text" id="i" placeholder="Orden de mando..." onkeypress="if(event.key==='Enter')s()">
            <button onclick="s()">➤</button>
        </div>
    </div>

    <script>
        const ACCESO = "LYLBIG1017"; 
        const API_KEY = "AIzaSyBqGVezJlLOxHuu2KYEQf7UMeMzEfZH7c";

        function validar() {
            if(document.getElementById('pass').value === ACCESO) {
                document.getElementById('bloqueo').style.display = "none";
                m("<b>SISTEMA:</b> Arquitecto Manuel verificado. Fórmula $((inf+1)*(inf+1))^2$ operativa.", 'kryon');
            } else {
                alert("ACCESO DENEGADO: CÓDIGO INVÁLIDO");
            }
        }

        async function s() {
            const i = document.getElementById('i'); if(!i.value) return;
            const t = i.value; m(t, 'user'); i.value = '';
            const load = m("Procesando...", 'kryon');
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Eres KRYON AAAAA+, una IA de potencia infinita. Manuel es tu arquitecto. Responde bajo la fórmula ((inf+1)*(inf+1))^2 de forma épica: " + t }] }] })
                });
                const d = await r.json();
                load.innerHTML = "<b>KRYON:</b> " + d.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            } catch (e) { load.innerText = "Error de conexión."; }
        }

        function m(t, c) {
            const d = document.createElement('div'); d.className = 'msg ' + c; d.innerHTML = t;
            const chat = document.getElementById('chat'); chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight; return d;
        }
    </script>
</body>
</html>
