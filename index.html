<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYON AAAAAA+</title>
    <style>
        body { background: #000; color: #00e5ff; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #bloqueo { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 999; }
        .card { border: 2px solid #00e5ff; padding: 30px; border-radius: 20px; text-align: center; background: #050505; width: 85%; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .m { padding: 12px; border-radius: 15px; max-width: 85%; font-size: 16px; border: 1px solid #1a1a1a; }
        .k { background: #001a1d; border-color: #00e5ff; align-self: flex-start; }
        .u { background: #111; color: #fff; align-self: flex-end; }
        .bar { padding: 15px; background: #000; border-top: 1px solid #1a1a1a; display: flex; gap: 10px; }
        input { flex: 1; background: #080808; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 25px; outline: none; }
        button { background: #00e5ff; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="bloqueo">
        <div class="card">
            <h1>KRYON</h1>
            <p style="color:#FFD700; font-size:10px;">((inf+1)*(inf+1))^2 + NÚCLEO PROYECTO</p>
            <input type="password" id="pass" placeholder="CÓDIGO LYL" style="width:100%; text-align:center; margin: 20px 0; background:#000; color:#fff; border:1px solid #333;">
            <button onclick="check()" style="width:100%; height:45px;">ACTIVAR</button>
        </div>
    </div>
    <div id="chat"></div>
    <div class="bar">
        <input type="text" id="in" placeholder="Ordena al núcleo..." onkeypress="if(event.key==='Enter')send()">
        <button onclick="send()">➤</button>
    </div>
   <script>
    const MASTER = "LYLBIG1017";
    function check() { if(document.getElementById('pass').value.toUpperCase() === MASTER) document.getElementById('bloqueo').style.display = 'none'; }

    async function send() {
        const input = document.getElementById('in'); if(!input.value) return;
        const text = input.value; add(text, "u"); input.value = "";
        const load = add("Conectando...", "k");

        try {
            const r = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });
            const d = await r.json();
            load.innerHTML = "<b>KRYON:</b> " + d.text.replace(/\n/g, '<br>');
        } catch (e) { load.innerText = "Error de conexión."; }
    }
    function add(t, c) {
        const d = document.createElement('div'); d.className = 'm ' + c; d.innerHTML = t;
        document.getElementById('chat').appendChild(d);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        return d;
    }
</script>

</body>
</html>
