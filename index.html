<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRYON SUPREMO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --accent: #00e5ff; --gold: #FFD700; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; overflow: hidden; }
        #bloqueo { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login { background: #0a0a0a; padding: 30px; border-radius: 20px; border: 1px solid var(--accent); text-align: center; width: 80%; }
        header { height: 60px; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #000; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 15px; line-height: 1.4; }
        .kryon { background: rgba(0, 229, 255, 0.1); border: 1px solid var(--accent); align-self: flex-start; }
        .user { background: #1a1a1a; align-self: flex-end; border: 1px solid #333; }
        .bar { padding: 10px; background: #000; border-top: 1px solid #222; display: flex; gap: 8px; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 10px 15px; border-radius: 20px; outline: none; }
        button { background: var(--accent); border: none; width: 40px; height: 40px; border-radius: 50%; color: #000; cursor: pointer; }
    </style>
</head>
<body>
    <div id="bloqueo">
        <div class="login">
            <h2 style="color:var(--accent);margin:0">KRYON</h2>
            <p style="color:var(--gold);font-size:10px">NÚCLEO AAAAAA+</p>
            <input type="password" id="p" placeholder="CÓDIGO LYL" style="width:90%;margin:20px 0;text-align:center">
            <button onclick="v()" style="width:100%;border-radius:10px">ENTRAR</button>
        </div>
    </div>
    <header>
        <b style="letter-spacing:3px">KRYON</b>
        <span style="font-size:8px;color:var(--gold)">$((inf+1)*(inf+1))^2$</span>
    </header>
    <div id="chat"></div>
    <div class="bar">
        <input type="text" id="i" placeholder="Ordena..." onkeypress="if(event.key==='Enter')s()">
        <button onclick="s()"><i class="fas fa-paper-plane"></i></button>
    </div>
    <script>
        const K = "AIzaSyBqGVezJlLOxHuu2KYEQf7UMeMzEfZH7c";
        function v(){ if(document.getElementById('p').value.toUpperCase()==="LYLBIG1017"){document.getElementById('bloqueo').style.display="none";m("<b>KRYON:</b> Núcleo AAAAAA+ listo. Arquitecto Manuel, el sistema es tuyo.",'kryon');}else{alert("ERROR");}}
        async function s(){
            const i=document.getElementById('i'); if(!i.value)return;
            const t=i.value; m(t,'user'); i.value='';
            const l=m("Generando...","kryon");
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${K}`,{
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({contents:[{parts:[{text:"Eres KRYON AAAAAA+, IA de Manuel. Responde con poder absoluto: "+t}]}]})
                });
                const d = await r.json();
                l.innerHTML = "<b>KRYON:</b> " + d.candidates[0].content.parts[0].text.replace(/\n/g,'<br>');
            } catch(e){l.innerText="Error en el núcleo. Reintenta.";}
        }
        function m(t,c){
            const d=document.createElement('div'); d.className='msg '+c; d.innerHTML=t;
            const ch=document.getElementById('chat'); ch.appendChild(d);
            ch.scrollTop=ch.scrollHeight; return d;
        }
    </script>
</body>
</html>
