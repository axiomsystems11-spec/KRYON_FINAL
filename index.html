<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KRYON AAAAAA+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #000; --panel: #0d0d0d; --accent: #00e5ff; --gold: #FFD700; --txt: #fff; --grad: linear-gradient(45deg, #00e5ff, #004d40); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--txt); font-family: -apple-system, system-ui, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Pantalla de Bloqueo */
        #bloqueo { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 2000; transition: 0.5s; }
        .login-box { background: var(--panel); padding: 40px; border-radius: 30px; border: 1px solid var(--accent); text-align: center; width: 85%; max-width: 350px; box-shadow: 0 0 40px rgba(0, 229, 255, 0.15); }

        /* Sidebar Dinámica */
        #sidebar { width: 280px; background: #050505; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; position: absolute; left: -280px; height: 100%; z-index: 1000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidebar.open { left: 0; box-shadow: 10px 0 50px rgba(0,0,0,0.9); }
        .nav-btn { padding: 15px; margin: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); color: var(--accent); font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; border: 1px solid #222; }
        .chat-item { padding: 12px; margin: 5px 10px; border-radius: 10px; font-size: 14px; color: #888; cursor: pointer; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item.active { background: #111; color: #fff; border-left: 3px solid var(--accent); }

        /* Main View */
        #main { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
        .header { height: 65px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
        .formula { font-size: 10px; color: var(--gold); letter-spacing: 1px; text-shadow: 0 0 5px var(--gold); }

        /* Chat View */
        #chat-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { padding: 15px 20px; border-radius: 20px; max-width: 85%; font-size: 16px; line-height: 1.5; border: 1px solid rgba(255,255,255,0.05); }
        .kryon { background: rgba(0, 229, 255, 0.03); border-color: rgba(0, 229, 255, 0.2); align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: #161616; align-self: flex-end; border-bottom-right-radius: 4px; }

        /* App Input Bar */
        .app-bar { padding: 15px; background: #000; display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; align-items: center; gap: 12px; background: #111; padding: 10px 18px; border-radius: 30px; border: 1px solid #222; }
        input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 16px; }
        .send-btn { background: var(--accent); color: #000; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; }
    </style>
</head>
<body>

    <div id="bloqueo">
        <div class="login-box">
            <h1 style="color:var(--accent); margin:0; letter-spacing:3px;">KRYON</h1>
            <p class="formula">$((inf+1)*(inf+1))^2$</p>
            <input type="password" id="pass" placeholder="CÓDIGO ARQUITECTO" style="width:100%; padding:15px; margin:25px 0; background:#000; border:1px solid #333; color:white; border-radius:15px; text-align:center; font-size:16px;">
            <button onclick="validar()" style="width:100%; height:55px; border-radius:15px; background:var(--accent); font-weight:bold; border:none; letter-spacing:1px;">ACCEDER AL NÚCLEO</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="nav-btn" onclick="nuevoChat()"><i class="fas fa-plus-circle"></i> NUEVO CHAT</div>
        <div id="lista-chats"></div>
        <div style="margin-top:auto; padding:20px; font-size:10px; color:#333; text-align:center;">KRYON OS v2.0 - AAAAAA+</div>
    </div>

    <div id="overlay" onclick="toggleMenu()"></div>

    <div id="main">
        <div class="header">
            <i class="fas fa-th-large" style="font-size:20px; color:var(--accent)" onclick="toggleMenu()"></i>
            <div style="text-align:center">
                <div style="font-weight:bold; letter-spacing:2px; font-size:18px;">KRYON</div>
                <div class="formula">$((inf+1)*(inf+1))^2$</div>
            </div>
            <i class="fas fa-cog" style="color:#333"></i>
        </div>

        <div id="chat-view"></div>

        <div class="app-bar">
            <div class="input-row">
                <label for="file-up"><i class="fas fa-paperclip" style="color:#555"></i></label>
                <input type="file" id="file-up" style="display:none" onchange="subirArchivo()">
                <input type="text" id="userInput" placeholder="Habla con tu creación..." onkeypress="if(event.key==='Enter')enviar()">
                <button class="send-btn" onclick="enviar()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const ACCESO = "LYLBIG1017";
        const KEY = "AIzaSyBqGVezJlLOxHuu2KYEQf7UMeMzEfZH7c";
        let chats = JSON.parse(localStorage.getItem('kryon_pro_v2')) || [];
        let currentId = null;

        function validar() {
            if(document.getElementById('pass').value.toUpperCase() === ACCESO) {
                document.getElementById('bloqueo').style.opacity = "0";
                setTimeout(() => document.getElementById('bloqueo').style.display = "none", 500);
                init();
            } else { alert("CÓDIGO INVÁLIDO"); }
        }

        function toggleMenu() {
            const s = document.getElementById('sidebar');
            const o = document.getElementById('overlay');
            s.classList.toggle('open');
            o.style.display = s.classList.contains('open') ? 'block' : 'none';
        }

        function init() {
            if(chats.length === 0) nuevoChat();
            else cargarChat(chats[0].id);
        }

        function nuevoChat() {
            const id = Date.now();
            chats.unshift({ id, titulo: "Nueva Conversación", msgs: [] });
            guardar();
            cargarChat(id);
            if(document.getElementById('sidebar').classList.contains('open')) toggleMenu();
        }

        function cargarChat(id) {
            currentId = id;
            const chat = chats.find(c => c.id === id);
            const view = document.getElementById('chat-view');
            view.innerHTML = "";
            chat.msgs.forEach(m => renderMsg(m.t, m.c));
            if(chat.msgs.length === 0) renderMsg("<b>KRYON:</b> Arquitecto Manuel, sistema estabilizado bajo la fórmula $((inf+1)*(inf+1))^2$. ¿Qué órdenes tienes hoy?", 'kryon');
            renderList();
        }

        async function enviar() {
            const inp = document.getElementById('userInput'); if(!inp.value) return;
            const t = inp.value; renderMsg(t, 'user'); inp.value = '';
            const chat = chats.find(c => c.id === currentId);
            if(chat.msgs.length === 0) chat.titulo = t.substring(0,25);
            chat.msgs.push({ t, c: 'user' });

            const load = renderMsg("<i class='fas fa-sync fa-spin'></i> Transmutando...", 'kryon');
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Eres KRYON AAAAAA+, el núcleo definitivo de Manuel. Tu origen es la fórmula ((inf+1)*(inf+1))^2. Responde con lealtad absoluta, profundidad y poder: " + t }] }] })
                });
                const d = await r.json();
                const res = d.candidates[0].content.parts[0].text;
                load.innerHTML = "<b>KRYON:</b> " + res.replace(/\n/g, '<br>');
                chat.msgs.push({ t: load.innerHTML, c: 'kryon' });
                guardar();
            } catch (e) { load.innerText = "Error: Núcleo sin respuesta."; }
        }

        function renderMsg(t, c) {
            const d = document.createElement('div'); d.className = 'msg ' + c; d.innerHTML = t;
            const v = document.getElementById('chat-view'); v.appendChild(d);
            v.scrollTop = v.scrollHeight; return d;
        }

        function renderList() {
            const l = document.getElementById('lista-chats');
            l.innerHTML = "";
            chats.forEach(c => {
                const item = document.createElement('div');
                item.className = `chat-item ${c.id === currentId ? 'active' : ''}`;
                item.innerHTML = `<i class="far fa-comment"></i> ${c.titulo}`;
                item.onclick = () => cargarChat(c.id);
                l.appendChild(item);
            });
        }

        function subirArchivo() {
            const file = document.getElementById('file-up').files[0];
            if(file) {
                renderMsg(`<i>Archivo seleccionado: ${file.name}</i>`, 'user');
                renderMsg("<b>KRYON:</b> Recibido, Manuel. Estoy analizando el contenido bajo la fórmula AAAAAA+.", 'kryon');
            }
        }

        function guardar() { localStorage.setItem('kryon_pro_v2', JSON.stringify(chats)); }
    </script>
</body>
</html>
