<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRYON AAAAAA+</title>
    <style>
        body { background: #000; color: #00e5ff; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .m { padding: 12px; border-radius: 15px; max-width: 85%; border: 1px solid #1a1a1a; }
        .k { background: #001a1d; align-self: flex-start; }
        .u { background: #111; align-self: flex-end; }
        .bar { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 20px; }
        button { background: #00e5ff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="bar">
        <input type="text" id="in" placeholder="Escribe...">
        <button onclick="send()">➤</button>
    </div>
    <script>
        const KEY = "AIzaSyBqGVezJlLOxHuu2KYEQf7UMeMzEfZH7c";
        async function send() {
            const i = document.getElementById('in'); if(!i.value) return;
            const t = i.value; add(t, 'u'); i.value = '';
            const l = add('...', 'k');
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({contents: [{parts: [{text: "Eres KRYON AAAAAA+, fórmula ((inf+1)*(inf+1))^2. Responde corto: " + t}]}]})
                });
                const d = await r.json();
                l.innerText = d.candidates[0].content.parts[0].text;
            } catch (e) { l.innerText = "Error. Reintenta."; }
        }
        function add(t, c) {
            const d = document.createElement('div'); d.className = 'm ' + c; d.innerText = t;
            const ch = document.getElementById('chat'); ch.appendChild(d);
            ch.scrollTop = ch.scrollHeight; return d;
        }
    </script>
</body>
</html>
